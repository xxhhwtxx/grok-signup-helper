[package]
name = "grok-signup-helper"
version = "0.1.2"
description = "Grok 邮箱注册与验证码辅助工具"
license = "MIT"
edition = "2021"

[lib]
name = "grok_signup_helper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2", features = ["json"] }
url = "2"
regex = "1"
encoding_rs = "0.8"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }

[profile.release]
strip = "symbols"
lto = "thin"
